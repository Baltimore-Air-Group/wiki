# Production deployment for the BAG wiki (BookStack + themes/bag/).
# Ingress is handled by the host's Traefik instance via the labels
# below — this stack exposes no host ports.
#
# Configuration is supplied as environment variables (no .env file
# required) — enter them in Hostinger Docker Manager's environment
# section, or `export` them before `docker compose up`. The variables
# consumed below are listed in .env.production.example.
#
# Networking: no explicit networks are declared. Compose creates one
# default network for the project; Traefik discovers the app on it.
#
# Prerequisite: a DNS record pointing wiki.baltimoreairgroup.org here.

services:
  app:
    image: ${WIKI_IMAGE:-ghcr.io/baltimore-air-group/wiki:latest}
    restart: unless-stopped
    environment:
      # --- Application ---
      APP_KEY: ${APP_KEY:?APP_KEY is required}
      APP_URL: ${APP_URL:-https://wiki.baltimoreairgroup.org}
      APP_THEME: bag
      APP_DEBUG: ${APP_DEBUG:-false}
      # --- Database (host/port fixed to the compose service) ---
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-bookstack}
      DB_USERNAME: ${DB_USERNAME:-bookstack}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      # --- Mail ---
      MAIL_DRIVER: ${MAIL_DRIVER:-log}
      MAIL_FROM: ${MAIL_FROM:-wiki@baltimoreairgroup.org}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Baltimore Air Group Wiki}
      # --- Authentication (see themes/bag/SETUP.md) ---
      AUTH_METHOD: ${AUTH_METHOD:-standard}
      OIDC_NAME: ${OIDC_NAME:-Baltimore Air Group}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_ISSUER_DISCOVER: ${OIDC_ISSUER_DISCOVER:-true}
      OIDC_EXTERNAL_ID_CLAIM: ${OIDC_EXTERNAL_ID_CLAIM:-sub}
      OIDC_USER_TO_GROUPS: ${OIDC_USER_TO_GROUPS:-false}
      OIDC_GROUPS_CLAIM: ${OIDC_GROUPS_CLAIM:-groups}
      OIDC_REMOVE_FROM_GROUPS: ${OIDC_REMOVE_FROM_GROUPS:-false}
      OIDC_ADDITIONAL_SCOPES: ${OIDC_ADDITIONAL_SCOPES:-}
      OIDC_DUMP_USER_DETAILS: ${OIDC_DUMP_USER_DETAILS:-false}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - storage:/app/storage          # logs, sessions, cache, attachments
      - uploads:/app/public/uploads   # uploaded images
    labels:
      - traefik.enable=true
      - traefik.http.routers.bsir-wiki.rule=Host(`wiki.baltimoreairgroup.org`)
      - traefik.http.routers.bsir-wiki.entrypoints=websecure
      - traefik.http.routers.bsir-wiki.tls.certresolver=letsencrypt
      - traefik.http.services.bsir-wiki.loadbalancer.server.port=80

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-bookstack}
      MYSQL_USER: ${DB_USERNAME:-bookstack}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  db:
  storage:
  uploads:
